name: Build APK and AAB (Android)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Decode Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Release Bundle (AAB)
        run: gradle bundleRelease --stacktrace || gradle bundleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Ludo-Empire-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Ludo-Empire-AAB-Bundle
          path: app/build/outputs/bundle/**/*.aab
